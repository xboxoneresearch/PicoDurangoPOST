paragraph=Watches SDA/SCL as plain GPIO inputs and reconstructs START/ADDRESS WRITE/ADDRESS READ/DATA WRITE/DATA READ/STOP events for one specific I2C address, without acting as a bus participant (no ACK, no hardware I2C slave role). Callback-registration API modeled on TwoWire's onReceive()/onRequest().
